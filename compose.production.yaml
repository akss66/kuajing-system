name: tongzhouxing-shop

x-app: &app
  image: tongzhouxing-shop:${APP_VERSION:-current}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  environment:
    FEISHU_CARGO_IMPORT_ENABLED: ${FEISHU_CARGO_IMPORT_ENABLED:-false}
    # Production source access is permanently read-only. This cannot be
    # overridden by the secret env file.
    FEISHU_CARGO_WRITES_ENABLED: "false"
    # Jifeng is connected later from the administrator console. Until the
    # developer credentials arrive, the integration remains UNCONFIGURED and
    # the fulfillment worker fails closed instead of blocking deployment.
    JIFENG_BASE_URL: ${JIFENG_BASE_URL:-}
    JIFENG_CLIENT_ID: ${JIFENG_CLIENT_ID:-}
    JIFENG_CLIENT_SECRET: ${JIFENG_CLIENT_SECRET:-}
    JIFENG_TOKEN_ENCRYPTION_KEY: ${JIFENG_TOKEN_ENCRYPTION_KEY:-}
    WORKER_HEALTH_FILE: /tmp/tongzhouxing-worker-health.json
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 20m
  networks:
    - backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
    networks:
      backend:
        aliases:
          - shop-postgres
    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 896m
    networks:
      backend:
      edge:
        aliases:
          - tongzhouxing-web
    volumes:
      - catalog_assets:/app/data/catalog-assets

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --import
        - tsx
        - src/jobs/worker-health.ts
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 640m
    volumes:
      - catalog_assets:/app/data/catalog-assets

networks:
  backend:
  edge:
    external: true
    name: dyflow_default

volumes:
  catalog_assets:
    name: tongzhouxing_shop_catalog_assets
  postgres_data:
    name: tongzhouxing_shop_postgres_data
